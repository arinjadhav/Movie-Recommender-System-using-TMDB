<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="376" viewBox="0 0 1000 376" role="img" aria-label="Features: searchable dropdown, five similar movies, live posters, no user data needed, instant results, clean UI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
